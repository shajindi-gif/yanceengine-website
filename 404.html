<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面未找到 | 衍策引擎</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; padding: 2rem; }
    .error-code { font-size: 6rem; font-weight: 800; color: var(--accent); margin: 0; line-height: 1; }
    .error-msg { font-size: 1.25rem; color: var(--text-secondary); margin: 1rem 0 2rem; }
  </style>
</head>
<body>
  <div class="error-page">
    <h1 class="error-code">404</h1>
    <p class="error-msg">页面未找到，可能已被移除或地址有误。</p>
    <a href="/" class="btn btn-primary">返回首页</a>
  </div>
</body>
</html>
